<section [formGroup]="formGroup">
    <h3 class="text-sm font-semibold text-[#344054] mb-[20px] mt-[16px]">ADDRESS</h3>

    <div class="grid grid-cols-3 gap-3">
        <input formControlName="address" placeholder="Address" class="border p-2 rounded col-span-3" />

        <input formControlName="city" placeholder="City" class="border p-2 rounded" />

        <input formControlName="state" placeholder="State/Province" class="border p-2 rounded" />

        <input formControlName="zipCode" placeholder="Zip code" class="border p-2 rounded" />
    </div>

    <div class="mt-3">
        <button type="button" (click)="verifyAddress()"
            [disabled]="!formGroup.get('address')?.value"
            class=" bg-gray-200 border border-[#d0d5dd] px-4 py-2 text-[13px] text-[#091E4252] rounded hover:bg-gray-50 disabled:opacity-50">
            Verify address
        </button>
    </div>
</section>
